    <noscript>
      <h1>Fincile – Shopify Payout Reconciliation Tool</h1>
      <p>Fincile automatically reconciles Shopify payouts against Stripe, PayPal, Shopify Payments, and 11+ gateways including Square, Authorize.net, Braintree, Klarna, Afterpay, and Razorpay. Catch missing payments, duplicate charges, refund mismatches, and settlement gaps in minutes.</p>
      <h2>What Fincile Detects</h2>
      <ul>
        <li>Missing payments — orders marked paid in Shopify with no matching charge in your processor</li>
        <li>Duplicate charges — the same order charged more than once in Stripe or PayPal</li>
        <li>Refund mismatches — refunds in Shopify with no confirmed evidence in your processor</li>
        <li>Settlement gaps — Shopify order totals that don't match gateway payout records</li>
        <li>Processor fee errors — verify the actual net amount received for every order</li>
      </ul>
      <p>Works with Shopify, Stripe, PayPal, and Klarna. Get your free audit at getfincile.com.</p>
